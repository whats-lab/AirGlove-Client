[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airglove"
version = "0.1.0"
description = "AirGlove client: receive OpenXR hand joints from Spine, send haptics"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["airglove*"]

[tool.setuptools.package-data]
airglove = ["_lib/*/*"]
