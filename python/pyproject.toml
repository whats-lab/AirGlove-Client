[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airglove-client"
version = "0.1.0"
description = "AirGlove client: receive OpenXR hand joints from Spine, send haptics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy"]

authors = [{ name = "WHATs LAB Corp" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
viz = ["viser"]

[project.urls]
Homepage = "https://github.com/whats-lab/AirGlove-Client"

[tool.setuptools.packages.find]
include = ["airglove_client*"]

[tool.setuptools.package-data]
airglove_client = ["_lib/*/*", "viz/assets/*"]
