name: python

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Package binaries match native/
        run: python3 tools/sync_native.py --check
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build --out-dir dist python
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  test:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Load native library and round-trip a client
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import airglove_client, platform
          from airglove_client import Client, Side
          with Client(listen_port=47640, spine_port=47642) as client:
              assert client.hand(Side.LEFT) is None
              client.set_haptics(Side.RIGHT, [0, 1, 2, 3, 0])
              print(platform.system(), platform.machine(), "airglove_client", Client.version(), client.stats())
          PY

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber || gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
